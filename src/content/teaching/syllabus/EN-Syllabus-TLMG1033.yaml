course_information:
  description: "This intermediate level theoretical-practical professional training subject presents the fundamentals of wireless communications, by reviewing the characteristics, operation, and application of the main wireless networks in the industry such as WiFi. Bluetooth and Zigbee. In addition, the fundamentals of the mobile Internet are presented as a means to facilitate the integration of different wireless technologies. Finally, the knowledge of design, administration, management and application of wireless sensor networks (WSN) is covered."
  prerequisites:
    - "DATA NETWORKS - TLMG1032"
  corequisites: []
  course_type: "Required"
course_goals:
  instruction_outcomes:
    - "Identify basic concepts related to wireless and sensor networks for the design and implementation of the network infrastructure used in monitoring systems."
    - "Analyze the behavior of different ad hoc routing algorithms for implementation in a multi-hop wireless network and a sensor network."
    - "Analyze wireless sensor networks by using different simulation tools."
  student_outcomes:
    - "1. Ability to identify, formulate, and solve complex telematics engineering problems through the application of engineering, science, and mathematics principles."
    - "6. Ability to develop and conduct appropriate experimentation, analyze and interpret data, and use telematics engineering criteria to draw conclusions."
topics:
  - "Evaluation activities"
  - "Wireless Communications Fundamentals."
  - "Wireless Personal Area Network (WPAN)."
  - "Wireless local area network (WLAN)."
  - "Wireless Sensor Networks (WSN)."
