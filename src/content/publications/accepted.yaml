- id: edupar-2026-unplugged-cloud-architecting
  title: A Collaborative Classroom Activity for Teaching Cloud Architecting
  authors:
  - Steven Santillan
  - Cristina L. Abad
  conference: 40th IEEE International Parallel and Distributed Processing Symposium — EduPar 2026
  year: 2026
  month: 5
  status: Accepted
  doi: null
  links:
    program: https://tcpp.cs.gsu.edu/curriculum/?q=EduPar-26-technical-program
    paper: '[PROPORCIONAR]'
    repository: '[PROPORCIONAR]'
    slides: '[PROPORCIONAR]'
  keywords:
  - Cloud Computing Education
  - Cloud Architecture
  - Collaborative Activity
  - Active Learning
  - Education
  - Cloud Computing
  - Distributed, Parallel, and Cluster Computing
  - Software Performance Engineering
  abstract: We present a collaborative classroom activity aimed at helping students improve their cloud architecting skills. The activity is a collaborative design exercise where students are given a (synthetically generated, realistic) set of cloud components and are asked to think about how they could be integrated into a single architecture while considering possible real-world use cases, how the components could be connected, and whether additional cloud components are missing from the design. The lists of components provided to the students are synthetically generated to mimic real cloud architectures from a recent public dataset. Instructors can seed the generator with specific components to generate a list suitable for a specific type of architecture; e.g., FSx (Lustre) for HPC, Elastic MapReduce (Hadoop/Spark/...) for Big Data, or Lambda@Edge for edge computing. We present observational and questionnaire-based results from two runs across two semesters (18 students in semester 1 and 49 students in semester 2) in an undergraduate Distributed Systems and Cloud Computing class at ESPOL university in Ecuador. Student responses highlighted the positive value of the activity and showed that they were highly engaged and applied critical thinking and teamwork during the exercise. Our synthetic generator tool has been released on GitHub so that others can use it or adapt it.
- id: sas-2026-vendor-locked-telemetry
  title: 'Opening Vendor-Locked Telemetry: Non-Intrusive Decoding of Solar Inverter IoT Communications
    in Restricted Environments — A Case Study'
  authors:
  - Steven Santillan
  - Jose Cordova-Garcia
  conference: IEEE Sensors Applications Symposium (SAS 2026)
  year: 2026
  month: 7
  status: Accepted
  doi: null
  links:
    paper: '[PROPORCIONAR]'
    repository: '[PROPORCIONAR]'
    slides: '[PROPORCIONAR]'
    dataset: '[PROPORCIONAR]'
  keywords:
  - Internet of Things
  - Solar Inverters
  - Passive Monitoring
  - Telemetry Decoding
  - Network Traffic Analysis
  abstract: Commercial solar inverter systems rely on vendor-controlled cloud platforms to manage telemetry, data access, and device configuration. In restricted environments, however, a lack of administrative access prevents end users from retrieving operational data, compromising system transparency, trust, and the ability to perform independent monitoring. This paper presents a secure and vendor-independent method for acquiring telemetry from IoT-based solar inverters by intercepting and decoding proprietary communications between inverters, dataloggers, and the cloud. We deploy a Raspberry Pi as a passive network probe connected to the same gateway used by the vendor's dataloggers. Through controlled network sniffing, encrypted frames are captured, reconstructed, and reverse-engineered to extract operational variables without interacting with or disrupting the proprietary platform. The decoded data are forwarded securely via HTTPS to an institutional backend, where they are stored and visualized through a custom telemetry dashboard. Our results demonstrate the feasibility of trusted, transparent, and secure telemetry extraction in IoT energy systems when vendor cloud access is unavailable-offering a practical pathway toward resilience, auditability, and user sovereignty in constrained IoT environments.
- id: isc2-2026-child-safety-monitoring
  title: A Real-Time IoT-Based Child Safety and Wellbeing Monitoring System for Smart Childcare Centers
  authors:
  - Steven Santillan
  - Maria Fernanda Panchana Ochoa
  - Sandra Coello Suárez
  - Christopher Vaccaro
  conference: 2026 IEEE International Smart Cities Conference (ISC2)
  year: 2026
  month: 10
  status: Accepted
  doi: null
  links:
    paper: '[PROPORCIONAR]'
    repository: '[PROPORCIONAR]'
    slides: '[PROPORCIONAR]'
  keywords:
  - Internet of Things
  - Wearable Devices
  - Child Safety
  - Smart Childcare
  - Physiological Monitoring
  - Mobile Application
  - Real-Time Systems
  abstract: Child safety and wellbeing in childcare centers remain important challenges for smart and inclusive communities, particularly when caregivers must simultaneously supervise multiple young children. This paper presents a real-time Internet of Things (IoT)-based monitoring system designed to support child supervision, physiological monitoring, and communication among authorized users in a childcare center. The proposed prototype integrates a wearable bracelet equipped with an ESP32-C3 microcontroller, a MAX30102 sensor, and a SIM800L EVB cellular communication module. It also includes a Flutter-based mobile application, a Flask REST API, and an SQL database for data processing, storage, visualization, and notification management. The system was evaluated through cellular transmission tests using two mobile network operators, a 15-minute heart-rate sensing trial, backend request optimization, and a usability survey involving 31 participants, including parents, educators, and childcare coordinators. Communication tests produced average transmission times of approximately 3.5 and 6 seconds, depending on the network operator. The wearable prototype successfully captured heart-rate readings when properly fastened, although interruptions caused by device movement highlighted the need for an improved attachment mechanism. Backend optimization reduced application request time from approximately 3 seconds to 1 second. Participants also reported a generally positive perception of the system's usability and usefulness. These preliminary results demonstrate the technical feasibility of integrating wearable IoT devices and mobile applications to support safer and more responsive childcare services. Nevertheless, longer-term evaluations, stronger privacy safeguards, improved wearable ergonomics, and validation across additional childcare environments are required before operational deployment.
- id: isc2-2026-brick-semantic-architecture
  title: 'Towards Urban Data Interoperability: A Brick-Based Semantic Architecture for Smart Building Data Spaces'
  authors:
  - Steven Santillan
  - Kevin Vargas Benavides
  - Pier Colina Arteaga
  - Jose Cordova-Garcia
  conference: 2026 IEEE International Smart Cities Conference (ISC2)
  year: 2026
