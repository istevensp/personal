    paper: '[PROPORCIONAR]'
    repository: '[PROPORCIONAR]'
    slides: '[PROPORCIONAR]'
  keywords:
  - Smart Cities
  - Semantic Interoperability
  - Brick Schema
  - Internet of Things
  - Smart Buildings
  - RDF
  - Data Spaces
  abstract: Smart city ecosystems increasingly depend on heterogeneous data generated by buildings, sensors, and urban infrastructures. However, the lack of common semantic models limits interoperability, data reuse, and the integration of smart building information into broader urban data spaces. This paper proposes a Brick-based semantic architecture for smart building data spaces, aimed at enabling standardized representation, integration, and querying of IoT-generated data. The proposed approach models the physical and logical infrastructure of Building 11C at Escuela Superior Politecnica del Litoral (ESPOL), including laboratories, outdoor areas, zones, equipment, and sensors, using Brick Schema and RDF-based representations. The architecture integrates IoT data acquisition, semantic modeling, operational storage, and interactive visualization. Sensor data are collected through MQTT and Node-RED workflows, stored in MongoDB, and semantically linked to a Brick-based RDF graph managed through Apache Jena Fuseki. Custom semantic properties are introduced to connect Brick entities with operational sensor records, enabling traceability between data points, physical locations, and building assets. A Django backend and ReactFlow-based interface support data access, management, and visualization of the semantic graph. The case study demonstrates that Brick can provide a consistent semantic layer for reducing ambiguity, improving interoperability, and supporting the integration of smart building data into future smart city data spaces.
- id: oceans-2026-artisanal-fishing-iot
  title: Prototype of a System for the Management and Monitoring of Vessels in Artisan Fishing
  authors:
  - Sandra Coello Suárez
  - Angelo Yagual
  - Steven Santillan
  - Vladimir Sanchez Padilla
  - Albert Espinal
  conference: OCEANS 2026 (Monterey, CA)
  year: 2026
  month: 9
  status: Accepted
  doi: null
  links:
    paper: '[PROPORCIONAR]'
    repository: '[PROPORCIONAR]'
    slides: '[PROPORCIONAR]'
  keywords:
  - Artisanal Fishing
  - Internet of Things (IoT)
  - Low-Cost Technology
  - Electronic Log
  - Social Implications of Technology
  - GPS Tracking
  - Temperature Monitoring
  - Offline-First Architecture
  abstract: Artisanal fishing is a vital economic pillar in emerging economies like Ecuador, yet it suffers from a significant technological gap. Most vessels lack basic positioning and environmental monitoring systems, relying on manual logs that hinder regulatory compliance and operational safety. This paper presents the development of a low-cost IoT prototype designed to bridge this gap. The system integrates an ESP32 microcontroller with waterproof temperature sensors (DS18B20) and a mobile application developed in Android Studio. A key innovation is the "offline-first" architecture using Firebase Cloud Firestore, allowing data persistence during high-seas operations without cellular coverage, with automatic synchronization upon returning to port. Technical validation against professional-grade instruments (YSI Pro20 and GPS-73) yielded mean error rates below 1.43% for temperature and 0.67% for positioning. Furthermore, the system automates mandatory electronic logbooks, reducing administrative burdens and supporting sustainable fishing practices by monitoring Illegal, Unreported, and Unregulated (IUU) fishing. Beyond technical metrics, the project achieved a 94% user acceptance rate among local fishers. Economic analysis shows a Net Present Value (NPV) of US$ 81,316.21 and an Internal Rate of Return (IRR) of 50%, confirming its financial scalability. This solution demonstrates how accessible technology can empower coastal communities, enhance maritime domain awareness, and foster citizen-science participation in ocean observations.
