- id: ic2e-2025-hpc-edge-architectures
  title: An Analysis of HPC and Edge Architectures in the Cloud
  authors:
  - Steven Santillan
  - Cristina L. Abad
  conference: 2025 IEEE International Conference on Cloud Engineering (IC2E 2025)
  year: 2025
  month: 9
  status: Published
  doi: https://doi.org/10.1109/IC2E65552.2025.00043
  links:
    preprint: https://arxiv.org/abs/2508.01494
    repository: https://github.com/disel-espol/hpc-and-edge-cloud-architectures
    doi: https://doi.org/10.1109/IC2E65552.2025.00043
    paper: https://ieeexplore.ieee.org/stamp/stamp.jsp?tp=&arnumber=11196640&isnumber=11196102
  keywords:
  - Cloud Computing
  - Architecture
  - Buildings
  - Computer Architecture
  - Machine Learning
  - Companies
  - Market Research
  - Reproducibility of Results
  - Complexity Theory
  - Edge Computing
  - HPC
  - Fog Computing
  - Architectures
  - Workflows
  - AWS
  - Cloud Continuum
  abstract: We analyze a recently published dataset of 396 real-world cloud architectures deployed on AWS, from companies belonging to a wide range of industries. From this dataset, we identify those architectures that contain HPC or edge components and characterize their designs. Specifically, we investigate the prevalence and interplay of AWS services within these architectures, examine the types of storage systems employed, assess architectural complexity and the use of machine learning services, discuss the implications of our findings and how representative these results are of HPC and edge architectures in the cloud. This characterization provides valuable insights into current industry practices and trends in building robust and scalable HPC and edge solutions in the cloud continuum, and can be valuable for those seeking to better understand how these architectures are being built and to guide new research.
- id: isgt-la-2025-energy-efficiency
  title: 'Predictive Monitoring of Energy Efficiency: Supervised Learning Case Study'
  authors:
  - Alberto Cruz
  - Sandra Coello Suárez
  - Steven Santillan Padilla
  - Jose Cordova-Garcia
  conference: 2025 IEEE PES Innovative Smart Grid Technologies Conference — Latin America (ISGT Latin
    America)
  year: 2025
  month: 9
  status: Published
  doi: https://doi.org/10.1109/ISGTLA64895.2025.11371217
  links:
    doi: https://doi.org/10.1109/ISGTLA64895.2025.11371217
    paper: https://ieeexplore.ieee.org/stamp/stamp.jsp?tp=&arnumber=11371217&isnumber=11371025
  keywords:
  - Energy Consumption
  - ISO Standards
  - Buildings
  - Supervised Learning
  - Predictive Models
  - Energy Efficiency
  - Noise Measurement
  - Forecasting
  - Monitoring
  - Long Short Term Memory
  - Energy Management
  - Data Availability
  - Data Quality
  - Machine Learning
  - LSTM
  - Random Forest
  - XAI
  abstract: Rising energy consumption in buildings and its environmental impact have brought significant attention to energy efficiency and monitoring practices. Many institutions adopt energy management systems aligned with ISO 50001, which emphasizes continuous monitoring and improvement. In this context, artificial intelligence and machine learning offer effective tools for detecting anomalies and forecasting energy demand. This study presents a practical approach using supervised learning models-Random Forest and Long Short-Term Memory (LSTM) networks-for short-term consumption forecasting and anomaly detection. The methodology relies on real-world data from a high-consumption university building, including manually labeled anomalies and high-frequency electrical measurements. Results show that both models are robust under noisy conditions, adaptable to different sampling resolutions, and benefit from periodic retraining. These findings support their integration into smart monitoring platforms aligned with ISO 50001 goals.
- id: sas-2024-hayiot
  title: 'HayIoT: An IoT Standardization Architecture'
  authors:
  - Jocellyn Luna
  - Steven Santillan Padilla
  - Jose Zapata
  - Francheska Iñiguez
  - Jose Cordova-Garcia
  conference: 2024 IEEE Sensors Applications Symposium (SAS 2024)
  year: 2024
  month: 7
  status: Published
  doi: https://doi.org/10.1109/SAS60918.2024.10636603
  links:
    doi: https://doi.org/10.1109/SAS60918.2024.10636603
    paper: https://ieeexplore.ieee.org/stamp/stamp.jsp?tp=&arnumber=10636603&isnumber=10636356
  keywords:
  - Protocols
  - Databases
  - Memory
  - Computer Architecture
  - Standardization
  - Ontologies
  - Internet of Things
  - Haystack
  - Ontology
  - Architecture
  - IoT
  abstract: Over the years, different sensor technologies have been developed based on various protocols, measurement types, and timing mechanisms, among other characteristics. Even sensors designed for similar purposes can use different technologies, giving rise to a data standardization challenge. With the growing number of Internet of Things (IoT) devices integrated into computing systems, the complexity and heterogeneity of the data continue to escalate. To address this, it becomes urgent to design IoT architectures that enable seamless integration and standardization of sensor data to incorporate the rising variety of devices. In this work, we introduce HayIoT, an architecture that uses the haystack standardization technology to record and store data from diverse IoT devices suitable for a built environment. The key concept is to include an Application Programming Interface (API) designed for data standardization and integration, along with a choice of a hybrid database for efficient data storage from IoT devices and their corresponding data models. We validate the proposed architecture by deploying it at a large university campus and taking advantage of the characteristics of the selected database, we address a practical challenge about data access and IoT interoperability. Additionally, optimizations were made to enhance the proposed architecture's efficiency and interoperability with IoT devices.
